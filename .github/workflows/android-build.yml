name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type to build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android platform
        run: |
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Build signed release APK
        if: ${{ inputs.build_type == 'release' }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing. Configure the four ANDROID_SIGNING_* repository secrets."
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          gradle --no-daemon :app:assembleRelease             -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-keystore.jks"             -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD"             -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS"             -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"

      - name: Delete old debug artifacts
        if: ${{ inputs.build_type == 'debug' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=santosa-racing-tools-debug&per_page=100" --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: santosa-racing-tools-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload release APK
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: santosa-racing-tools-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
